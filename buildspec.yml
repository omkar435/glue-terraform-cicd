version: 0.2

phases:

  install:
    commands:
      - echo Installing Terraform

      - curl -LO https://releases.hashicorp.com/terraform/1.14.0/terraform_1.14.0_linux_amd64.zip

      - unzip terraform_1.14.0_linux_amd64.zip

      - mv terraform /usr/local/bin/

      - terraform --version

  pre_build:
    commands:
      - echo Starting Terraform initialization

      - terraform init

  build:
    commands:
      - echo Running Terraform validation

      - terraform validate

      - echo Creating Terraform plan

      - terraform plan -out=tfplan

      - echo Applying Terraform changes

      - terraform apply -auto-approve tfplan

  post_build:
    commands:
      - echo Glue deployment completed successfully
      - terraform output